<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff2d75">
    <title>L'Antre - Trouvez vos plans</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-door-open"></i> L'Antre</h1>
        <p>Trouvez des partenaires près de vous, selon vos envies</p>
    </header>

    <div class="container">
        <!-- Section Géolocalisation -->
        <div class="section">
            <h2><i class="fas fa-map-marker-alt"></i> Localisation</h2>
            <button id="use-gps" class="btn btn-primary">
                <i class="fas fa-location-arrow"></i> Utiliser ma position GPS
            </button>
            <div class="or-separator">OU</div>
            <div class="manual-location">
                <input type="text" id="city-input" placeholder="Entrez une ville (ex: Paris)">
                <select id="radius-select">
                    <option value="5">5 km</option>
                    <option value="10">10 km</option>
                    <option value="25">25 km</option>
                    <option value="50" selected>50 km</option>
                    <option value="100">100 km</option>
                    <option value="200">200 km</option>
                </select>
            </div>
        </div>

        <!-- Section Filtres -->
        <div class="section">
            <h2><i class="fas fa-filter"></i> Filtres de Recherche</h2>
            
            <div class="filter-group">
                <h3><i class="fas fa-venus-mars"></i> Genre</h3>
                <select id="gender-select" multiple>
                    <option value="Femme" selected>Femme</option>
                    <option value="Homme">Homme</option>
                    <option value="Trans">Trans</option>
                    <option value="Couple">Couple</option>
                </select>
            </div>

            <div class="filter-group">
                <h3><i class="fas fa-theater-masks"></i> Rôle BDSM</h3>
                <select id="role-select" multiple>
                    <option value="Dominatrice" selected>Dominatrice</option>
                    <option value="Soumis" selected>Soumis</option>
                    <option value="Switch">Switch</option>
                </select>
            </div>

            <div class="filter-group">
                <h3><i class="fas fa-fire"></i> Pratiques</h3>
                <div class="checkbox-grid">
                    <label><input type="checkbox" name="practice" value="Sodomie" checked> Sodomie</label>
                    <label><input type="checkbox" name="practice" value="Femdom" checked> Femdom</label>
                    <label><input type="checkbox" name="practice" value="Bondage"> Bondage</label>
                </div>
            </div>

            <div class="filter-group">
                <h3><i class="fas fa-user"></i> Attributs Physiques</h3>
                <div class="checkbox-grid">
                    <label><input type="checkbox" name="attribute" value="Gros seins" checked> Gros seins</label>
                </div>
            </div>

            <button id="search-button" class="btn btn-primary" disabled>
                <i class="fas fa-search"></i> Lancer la Recherche
            </button>
        </div>

        <!-- Section Résultats -->
        <div class="section">
            <h2><i class="fas fa-list"></i> Résultats (<span id="result-count">0</span>)</h2>
            <div id="results" class="results-grid"></div>
        </div>
    </div>

    <script src="scripts/filters.js"></script>
    <script src="scripts/geolocation.js"></script>
    <script src="scripts/scraping.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
